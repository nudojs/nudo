<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 312" width="680" height="312" role="img" aria-labelledby="t d">
  <title id="t">Abs = shape × term × pred × conf</title>
  <desc id="d">四个分量：shape 外延载体、term 值身份、pred 约束、conf 精确度；示例 x+1 / number / &gt;1 / path</desc>
  <style>
    text { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .title { font-size: 14px; font-weight: 500; fill: #1f2937; }
    .body { font-size: 13px; font-weight: 400; fill: #1f2937; }
    .caption { font-size: 11px; font-weight: 400; fill: #6b7280; }
    .accent { fill: #5b4bdb; }
    .muted { fill: #6b7280; }
    .box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; }
    .box-accent { fill: #eef2ff; stroke: #5b4bdb; stroke-width: 1; }
  </style>

  <!-- header -->
  <text class="title" x="340" y="28" text-anchor="middle">Abs = shape × term × pred × conf</text>
  <text class="caption" x="340" y="48" text-anchor="middle">Nudo 唯一的类型系统 · 可计算值，约束参与代数（x &gt; 0 ⇒ x + 1 &gt; 1）</text>

  <!-- product row -->
  <!-- shape -->
  <rect class="box-accent" x="28" y="72" width="136" height="88" rx="8"/>
  <text class="body accent" x="96" y="100" text-anchor="middle" font-weight="500">shape</text>
  <text class="caption" x="96" y="120" text-anchor="middle">外延载体</text>
  <text class="caption" x="96" y="140" text-anchor="middle">值长什么样</text>

  <text class="body muted" x="180" y="122" text-anchor="middle">×</text>

  <!-- term -->
  <rect class="box" x="196" y="72" width="136" height="88" rx="8"/>
  <text class="body" x="264" y="100" text-anchor="middle" font-weight="500">term</text>
  <text class="caption" x="264" y="120" text-anchor="middle">抽象值身份</text>
  <text class="caption" x="264" y="140" text-anchor="middle">lit / var / app</text>

  <text class="body muted" x="348" y="122" text-anchor="middle">×</text>

  <!-- pred -->
  <rect class="box" x="364" y="72" width="136" height="88" rx="8"/>
  <text class="body" x="432" y="100" text-anchor="middle" font-weight="500">pred</text>
  <text class="caption" x="432" y="120" text-anchor="middle">相对 term 的约束</text>
  <text class="caption" x="432" y="140" text-anchor="middle">参与代数</text>

  <text class="body muted" x="516" y="122" text-anchor="middle">×</text>

  <!-- conf -->
  <rect class="box" x="532" y="72" width="120" height="88" rx="8"/>
  <text class="body" x="592" y="100" text-anchor="middle" font-weight="500">conf</text>
  <text class="caption" x="592" y="120" text-anchor="middle">精确度</text>
  <text class="caption" x="592" y="140" text-anchor="middle">exact / path / …</text>

  <!-- example annotation row -->
  <text class="caption" x="340" y="192" text-anchor="middle">示例 · scale(x) = x + 1，契约 x &gt; 0</text>

  <!-- example chips under each box -->
  <rect class="box-accent" x="40" y="208" width="112" height="36" rx="6"/>
  <text class="body accent" x="96" y="231" text-anchor="middle">number</text>

  <rect class="box-accent" x="208" y="208" width="112" height="36" rx="6"/>
  <text class="body accent" x="264" y="231" text-anchor="middle">x + 1</text>

  <rect class="box-accent" x="376" y="208" width="112" height="36" rx="6"/>
  <text class="body accent" x="432" y="231" text-anchor="middle">&gt; 1</text>

  <rect class="box-accent" x="544" y="208" width="96" height="36" rx="6"/>
  <text class="body accent" x="592" y="231" text-anchor="middle">path</text>

  <!-- footer note -->
  <text class="caption" x="340" y="278" text-anchor="middle">shape 给出外观 · term 给出身份 · pred 给出约束 · conf 给出可信度 —— 四者同时是一个 Abs</text>
</svg>
