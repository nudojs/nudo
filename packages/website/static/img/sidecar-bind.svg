<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="680" height="280" role="img" aria-labelledby="t d">
  <title id="t">sidecar 自动绑定</title>
  <desc id="d">calc.js 与 calc.nudo.js 自动绑定，进入 nudo check L1 显式契约门禁</desc>
  <style>
    text { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .title { font-size: 14px; font-weight: 500; fill: #1f2937; }
    .body { font-size: 13px; font-weight: 400; fill: #1f2937; }
    .caption { font-size: 11px; font-weight: 400; fill: #6b7280; }
    .ink { fill: #1f2937; }
    .muted { fill: #6b7280; }
    .accent { fill: #5b4bdb; }
    .box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; }
    .soft { fill: #eef2ff; stroke: #5b4bdb; stroke-width: 1; }
    .bind { stroke: #5b4bdb; stroke-width: 1.25; fill: none; marker-end: url(#acc); }
    .link { stroke: #6b7280; stroke-width: 1; fill: none; marker-end: url(#mut); }
  </style>
  <defs>
    <marker id="acc" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5b4bdb"/>
    </marker>
    <marker id="mut" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- header -->
  <text class="title" x="28" y="28">sidecar 自动绑定 · auto-bind</text>
  <text class="caption" x="28" y="48">同名侧车契约绑定到导出 · 进入 nudo check L1</text>

  <!-- calc.js -->
  <rect class="box" x="48" y="80" width="200" height="88" rx="8"/>
  <text class="body ink" x="148" y="112" text-anchor="middle" font-weight="500">calc.js</text>
  <text class="caption muted" x="148" y="134" text-anchor="middle">export function scale(x)</text>
  <text class="caption muted" x="148" y="152" text-anchor="middle">return x + 1</text>

  <!-- calc.nudo.js -->
  <rect class="box" x="288" y="80" width="200" height="88" rx="8"/>
  <text class="body ink" x="388" y="112" text-anchor="middle" font-weight="500">calc.nudo.js</text>
  <text class="caption muted" x="388" y="134" text-anchor="middle">export const scale = fn(</text>
  <text class="caption muted" x="388" y="152" text-anchor="middle">… number().gt(0) …)</text>

  <!-- auto-bind arrows -->
  <path class="bind" d="M248 124 L288 124"/>
  <text class="caption accent" x="268" y="116" text-anchor="middle">auto-bind</text>

  <!-- check L1 -->
  <path class="link" d="M488 124 L540 124"/>
  <rect class="soft" x="540" y="88" width="112" height="72" rx="8"/>
  <text class="body accent" x="596" y="118" text-anchor="middle" font-weight="500">nudo check</text>
  <text class="caption accent" x="596" y="140" text-anchor="middle">L1 显式契约</text>

  <!-- bottom note -->
  <text class="caption muted" x="340" y="208" text-anchor="middle">同名导出自动绑定（sidecar）· 也可用源内 @nudo:contract</text>
  <text class="caption muted" x="340" y="230" text-anchor="middle">绑定后 Pred 参与代数 · 违例报告 actual ⊭ expected</text>
  <text class="caption ink" x="340" y="256" text-anchor="middle">scale(0) → argument ⊭ precondition (nudo:constraint-violated)</text>
</svg>
