<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#0B0914"/>
  <rect x="48" y="48" width="1104" height="534" rx="24" stroke="#2A2440" stroke-width="2"/>
  <text x="88" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="#FAF8FF">Nudo</text>
  <text x="88" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="600" fill="#A29BFE">欢迎重回 JS 世界.</text>
  <text x="88" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#9B94AD">不限制你的 JS 表达，只忠实反映中间量与结果</text>
  <text x="88" y="318" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#9B94AD">并提供比类型更精确的契约校验</text>
  <text x="88" y="360" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#6B6580">Your JS stays JS — observe intermediates, enforce contracts sharper than types.</text>
  <rect x="88" y="400" width="640" height="88" rx="12" fill="#161326" stroke="#2A2440"/>
  <text x="112" y="438" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#6B6580">scale(x) → term (x+1)  pred (x+1) &gt; 1  #path</text>
  <text x="112" y="470" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#4ADE80">scale(0) ⊭ x &gt; 0   nudo:constraint-violated</text>
  <text x="88" y="540" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#A29BFE">nudojs.github.io/nudo</text>
</svg>
