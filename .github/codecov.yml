# Coverage gates for codecov uploads (ci.yml test job). `target: auto` +
# threshold = coverage may not silently crater below its own baseline;
# without a gate the check is always green and only ever decorative.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 2%
    patch:
      default:
        target: auto
        threshold: 5%

comment:
  layout: "diff, files"
  require_changes: true
