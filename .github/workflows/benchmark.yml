name: Benchmark

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: Inference benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # CLI 以 tsx 跑 src，但 workspace package.json exports → dist/；
      # 先构建保证 `pnpm run infer` 能解析 @nudojs/*。
      - name: Build packages
        run: npm run build

      # 跑分 + 硬门禁：exact/unknown/error 回退或 >3.0x 性能回退即失败（见 benchmark/src/gate.js）。
      # runner 本身崩溃（引擎回归）同样失败；有意变更走 pnpm run benchmark:baseline。
      - name: Run benchmark
        run: npm run benchmark

      - name: Gate against baseline
        run: npm run benchmark:gate

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark/results
