name: Benchmark

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: Inference benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v4（SHA 钉住：supply-chain；升级时更新 pin 与注释）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup pnpm
        # v4
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa

      - name: Setup Node.js
        # v4
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # CLI 以 tsx 跑 src，但 workspace package.json exports → dist/；
      # 先构建保证 `pnpm run infer` 能解析 @nudojs/*。
      - name: Build packages
        run: npm run build

      # 跑分 + 硬门禁：exact/unknown/error 回退或 >3.0x 性能回退即失败（见 benchmark/src/gate.js）。
      # runner 本身崩溃（引擎回归）同样失败；有意变更走 pnpm run benchmark:baseline。
      #
      # 3.0x 阈值（gate.js 硬编码）是有意保留的：baseline 在本地 Apple Silicon 上
      # 采样（avg 825ms），GitHub ubuntu runner 常年慢 ~2.5–3x（每 case 冷启动
      # `pnpm run infer`/tsx）。收到 2.0–2.5x 会把 runner 噪声当成回归、CI 变红。
      # 若要收紧：先在 GH runner 上重跑 `pnpm run benchmark:baseline`（或改成
      # 相对倍率/固定 perf runner），再改 gate.js 阈值——不要只改数字。
      - name: Run benchmark
        run: npm run benchmark

      - name: Gate against baseline
        run: npm run benchmark:gate

      # OSS 真包语料门禁（commander/yargs/semver，离线、无 secret，~20s）。
      # 只挂在 main：envelope（benchmark/oss/baseline.json）是绝对毫秒上限、
      # 机器敏感（约 2.5–2.8x runner 余量）；PR 上每个 commit 跑容易把噪声
      # 当回归。regenerate + gate 成对执行——gate 对比的是本次生成的
      # docs/reports/oss-perf-baseline.json 与已提交 envelope。
      - name: Run OSS benchmark
        run: pnpm run benchmark:oss

      - name: OSS baseline gate
        run: pnpm run benchmark:oss:gate

      - name: Upload results
        if: always()
        # v4
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: benchmark-results
          path: benchmark/results
