# Beta release — push to `dev` auto-versions (if changesets pending) and publishes
# with the npm dist-tag from `.changeset/pre.json` (currently `beta`).
#
# Contract:
# - `dev` is the beta train. Entering `changeset pre enter beta` (already on) +
#   pushing here publishes `x.y.z-beta.n` under tag `beta`.
# - `main` remains the stable train (release.yml). Exit pre mode before the
#   stable cut (`changeset pre exit`) — do not publish stable from this workflow.
# - VS Code Marketplace / Open VSX / GitHub Release stay on main only.
#
# Trusted Publishing: same `NPM_TOKEN` GitHub environment as release.yml.
# setup-node's .npmrc `_authToken` must be stripped or OIDC exchange 404s.

name: Release Beta

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-beta:
    name: Publish beta
    runs-on: ubuntu-latest
    # npm Trusted Publishing is bound to this GitHub environment name; the
    # OIDC token must carry the same environment claim or publish 404s.
    environment: NPM_TOKEN
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa  # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 24
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: npm run build

      # Same bar as stable: no untested publishes.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:coverage

      # Consume pending changesets into `*-beta.n` on the branch, then publish.
      # `[skip ci]` avoids a re-trigger loop; publish still runs in THIS job.
      # If nothing is pending (versions already on the branch), this is a no-op.
      - name: Version beta (if changesets pending)
        run: |
          set -euo pipefail
          if [ ! -f .changeset/pre.json ]; then
            echo "::error::Not in changesets pre mode. Run 'npx changeset pre enter beta' on dev before pushing."
            exit 1
          fi
          if ls .changeset/*.md >/dev/null 2>&1 && \
             ls .changeset/*.md | grep -v 'README.md' | grep -q .; then
            npx changeset version
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: version beta packages [skip ci]"
            git push origin HEAD:dev
          else
            echo "No pending changesets — publishing current package.json versions."
          fi

      - name: Publish to npm (tag from pre.json)
        run: |
          set -euo pipefail
          # setup-node writes _authToken=${NODE_AUTH_TOKEN} into .npmrc, which
          # blocks npm's OIDC trusted-publisher exchange when no real token exists.
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "${NPM_CONFIG_USERCONFIG}" ]; then
            sed -i '/_authToken/d' "${NPM_CONFIG_USERCONFIG}"
          fi
          # changeset publish uses the dist-tag in .changeset/pre.json ("beta")
          # and skips versions already on the registry.
          npx changeset publish
        env:
          NPM_CONFIG_PROVENANCE: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          {
            echo "## Beta publish"
            echo ""
            echo "Trigger: \`${GITHUB_REF_NAME}\` @ \`${GITHUB_SHA::7}\`"
            echo ""
            echo "npm dist-tag: \`beta\` (from \`.changeset/pre.json\`)"
            echo ""
            echo "Verify: \`npm view <pkg> dist-tags\` / \`npm view <pkg> versions\`"
          } >> "$GITHUB_STEP_SUMMARY"
