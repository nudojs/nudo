name: CI

on:
  push:
    branches: [main, dev, ci]
  pull_request:
    branches: [main, dev, ci]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# lint / build / test 并行。测试的 vitest 别名指向 src，但 path-based
# @nudo:env 会经 Node 动态 import 真实文件——那时按 package.json exports
# 解析 @nudojs/* → dist，故 test 也先 build。
jobs:
  lint:
    name: Lint (tsc x2) & docs examples
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v4（SHA 钉住：supply-chain；升级时更新 pin 与注释）
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup pnpm
        # v4
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa

      - name: Setup Node.js
        # v4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: npm run lint

      # website tsconfig paths 指向 monorepo 源码，但 @nudojs/* 的 package exports
      # 仍解析到 dist——未构建时 TS2307。与 Release 一致：先 build 再 lint website。
      - name: Build packages
        run: npm run build

      # 文档站 TSX 此前没有任何类型门禁（docusaurus build 走 babel，不检查类型）
      - name: Lint website
        run: npm run lint:website

      - name: Lint tests
        run: npm run lint:tests

      - name: Verify docs examples
        run: pnpm run verify:examples

      - name: Verify website doc examples
        run: pnpm run verify:docs

      - name: Verify docs site links
        run: pnpm run verify:links

      # 生成文件（releases*.md / api skeleton / versioning 版本表）不得与源漂移
      - name: Docs generation drift gate
        run: |
          pnpm run docs:gen
          git diff --exit-code -- \
            packages/website/docs/releases.md \
            packages/website/docs/releases-history.md \
            packages/website/docs/guides/versioning.md \
            packages/website/docs/api \
            packages/website/i18n/zh-Hans/docusaurus-plugin-content-docs/current/releases.md \
            packages/website/i18n/zh-Hans/docusaurus-plugin-content-docs/current/releases-history.md \
            packages/website/i18n/zh-Hans/docusaurus-plugin-content-docs/current/guides/versioning.md \
            packages/website/i18n/zh-Hans/docusaurus-plugin-content-docs/current/api

      # B1 — fail when committed docs/reports baseline drifted from env sources
      - name: Env coverage baseline check
        run: pnpm run coverage:env -- --check

      # Regenerate for artifact upload (does not gate)
      - name: Env coverage baseline regenerate
        if: always()
        run: pnpm run coverage:env

      - name: Upload env coverage report
        if: always()
        # v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: env-coverage-baseline
          path: |
            docs/reports/env-coverage-baseline.json
            docs/reports/env-coverage-baseline.md
          if-no-files-found: warn

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup pnpm
        # v4
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa

      - name: Setup Node.js
        # v4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: npm run build

      # 薄壳 bin 冒烟：走 workspace 链接 → @nudojs/cli dist。用户唯一入口，
      # 「build 后 bin 不能跑」类回归在此兜住（发布面卫生另由 npm-safe 管）。
      - name: Smoke nudo bin
        run: node packages/nudojs/dist/index.js --version

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup pnpm
        # v4
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa

      - name: Setup Node.js
        # v4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        # v4
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          flags: unittests
          fail_ci_if_error: false

  # B1: accuracy/perf gate vs benchmark/baseline.json
  # 3.0x 阈值（gate.js 硬编码）有意保留：baseline 采自本地 Apple Silicon，
  # GitHub ubuntu runner 常年慢 ~2.5–3x；收 2.0–2.5x 会把噪声当回归（CI 变红）。
  # 收紧前提：在 GH runner 上重跑 `pnpm run benchmark:baseline`（或改相对倍率
  # /固定 perf runner）后再改 gate.js——不要只改数字。
  # OSS 真包门禁（benchmark:oss + benchmark:oss:gate）挂在 benchmark.yml（main-only）。
  benchmark:
    name: Benchmark gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: npm run build

      - name: Run benchmark
        run: pnpm run benchmark

      - name: Gate against baseline
        run: pnpm run benchmark:gate
