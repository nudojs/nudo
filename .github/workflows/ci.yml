name: CI

on:
  push:
    branches: [main, develop, ci]
  pull_request:
    branches: [main, develop, ci]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# lint / build / test 并行。测试的 vitest 别名指向 src，但 path-based
# @nudo:env 会经 Node 动态 import 真实文件——那时按 package.json exports
# 解析 @nudojs/* → dist，故 test 也先 build。
jobs:
  lint:
    name: Lint (tsc x2) & docs examples
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v4（SHA 钉住：supply-chain；升级时更新 pin 与注释）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup pnpm
        # v4
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Setup Node.js
        # v4
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: npm run lint

      - name: Lint tests
        run: npm run lint:tests

      - name: Verify docs examples
        run: pnpm run verify:examples

      # B1 — fail when committed docs/reports baseline drifted from env sources
      - name: Env coverage baseline check
        run: pnpm run coverage:env -- --check

      # Regenerate for artifact upload (does not gate)
      - name: Env coverage baseline regenerate
        if: always()
        run: pnpm run coverage:env

      - name: Upload env coverage report
        if: always()
        # v4
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: env-coverage-baseline
          path: |
            docs/reports/env-coverage-baseline.json
            docs/reports/env-coverage-baseline.md
          if-no-files-found: warn

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup pnpm
        # v4
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Setup Node.js
        # v4
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: npm run build

      # 薄壳 bin 冒烟：走 workspace 链接 → @nudojs/cli dist。用户唯一入口，
      # 「build 后 bin 不能跑」类回归在此兜住（发布面卫生另由 npm-safe 管）。
      - name: Smoke nudo bin
        run: node packages/nudojs/bin/nudo.mjs --version

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup pnpm
        # v4
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Setup Node.js
        # v4
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        # v4
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          flags: unittests
          fail_ci_if_error: false

  # B1: accuracy/perf gate vs benchmark/baseline.json
  # runner noise is absorbed by the 3.0x threshold in gate.js
  benchmark:
    name: Benchmark gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: npm run build

      - name: Run benchmark
        run: pnpm run benchmark

      - name: Gate against baseline
        run: pnpm run benchmark:gate
