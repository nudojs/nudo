name: CI

on:
  push:
    branches: [main, dev, ci]
  pull_request:
    branches: [main, dev, ci]
  # 夜间复测：coverage 趋势 + benchmark（避开 PR 计时噪声）
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# event_name 入 group：schedule 跑在默认分支上，
# 否则会与 main push 抢同一 group 互相 cancel。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# 矩阵（build 只跑一次，dist 经 nudo-dist artifact 共享）：
#   push main         → lint / build / test:coverage / benchmark（全量门禁）
#   push dev|ci       → lint / build / test×2 shard（快速通道：无插桩、无计时）
#   pull_request      → lint / build / test×2 shard
#   schedule/dispatch → build / test:coverage / benchmark（夜间复测）
# test 依赖 dist：@nudo:env 动态 import 经 package.json exports 解析
# @nudojs/* → dist；lint:website 与 verify:* 脚本的 @nudojs/* 解析同样需要 dist。
# test 分 2 shard 并发（vitest --shard 按文件切分，pool: forks 下文件
# 间天然隔离）；test-coverage 不分——v8 阈值按全量聚合，分片需 merge
# coverage 报告，而 main/夜间路径本就不频繁，不值得引入复杂度。
jobs:
  lint:
    name: Lint (tsc x2) & docs examples
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v7（SHA 钉住：supply-chain；升级时更新 pin 与注释）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup pnpm
        # v4
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Setup Node.js
        # v7
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # build job 的产物（各包 dist/），替代本 job 原来的 npm run build
      - name: Download built dist
        # v8.0.1（SHA 钉住：supply-chain；升级时更新 pin 与注释）
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: nudo-dist

      - name: Lint
        run: npm run lint

      - name: Lint website
        run: npm run lint:website

      - name: Lint tests
        run: npm run lint:tests

      - name: Verify docs examples
        run: pnpm run verify:examples

      - name: Verify website doc examples
        run: pnpm run verify:docs

      - name: Verify docs site links
        run: pnpm run verify:links

      # 生成文件（releases*.md / api skeleton / versioning 版本表）不得与源漂移
      - name: Docs generation drift gate
        run: |
          pnpm run docs:gen
          git diff --exit-code -- \
            packages/website/docs/releases.md \
            packages/website/docs/releases-history.md \
            packages/website/docs/guides/versioning.md \
            packages/website/docs/api \
            packages/website/i18n/zh-Hans/docusaurus-plugin-content-docs/current/releases.md \
            packages/website/i18n/zh-Hans/docusaurus-plugin-content-docs/current/releases-history.md \
            packages/website/i18n/zh-Hans/docusaurus-plugin-content-docs/current/guides/versioning.md \
            packages/website/i18n/zh-Hans/docusaurus-plugin-content-docs/current/api

      # B1 — fail when committed docs/reports baseline drifted from env sources
      - name: Env coverage baseline check
        run: pnpm run coverage:env -- --check

      # Regenerate for artifact upload (does not gate)
      - name: Env coverage baseline regenerate
        if: always()
        run: pnpm run coverage:env

      - name: Upload env coverage report
        if: always()
        # v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: env-coverage-baseline
          path: |
            docs/reports/env-coverage-baseline.json
            docs/reports/env-coverage-baseline.md
          if-no-files-found: warn

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v7（SHA 钉住：supply-chain；升级时更新 pin 与注释）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup pnpm
        # v4
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Setup Node.js
        # v7
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: npm run build

      # 薄壳 bin 冒烟：走 workspace 链接 → @nudojs/cli dist。用户唯一入口，
      # 「build 后 bin 不能跑」类回归在此兜住（发布面卫生另由 npm-safe 管）。
      - name: Smoke nudo bin
        run: node packages/nudojs/dist/index.js --version

      # 全流水线共享的构建产物（lint/test/benchmark 各下载一次，
      # 替代各自重复的 npm run build）
      - name: Upload dist artifact
        # v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nudo-dist
          path: |
            packages/*/dist
          if-no-files-found: error
          retention-days: 1

  test:
    name: Test (shard ${{ matrix.shard }}/2)
    # PR 与 dev/ci push 的快速通道；main push 由 test-coverage 覆盖。
    # 2 shard 并发压墙时；fail-fast 关闭以保留双 shard 结果。
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v7（SHA 钉住：supply-chain；升级时更新 pin 与注释）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup pnpm
        # v4
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Setup Node.js
        # v7
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download built dist
        # v8.0.1（SHA 钉住：supply-chain；升级时更新 pin 与注释）
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: nudo-dist

      - name: Test
        run: npm run test -- --shard=${{ matrix.shard }}/2

  test-coverage:
    name: Test & Coverage
    # 仅 main push 与夜间复测：v8 插桩 + 阈值聚合比裸跑慢 30–60%
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v7（SHA 钉住：supply-chain；升级时更新 pin 与注释）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup pnpm
        # v4
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Setup Node.js
        # v7
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download built dist
        # v8.0.1（SHA 钉住：supply-chain；升级时更新 pin 与注释）
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: nudo-dist

      - name: Test
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        # v7
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          flags: unittests
          fail_ci_if_error: false

  # B1: accuracy/perf gate vs benchmark/baseline.json
  # 3.0x 阈值（gate.js 硬编码）有意保留：baseline 采自本地 Apple Silicon，
  # GitHub ubuntu-runner 常年慢 ~2.5–3x；收 2.0–2.5x 会把噪声当回归（CI 变红）。
  # 收紧前提：在 GH runner 上重跑 `pnpm run benchmark:baseline`（或改相对倍率
  # /固定 perf runner）后再改 gate.js——不要只改数字。
  # 仅 main push + 夜间：计时门禁在共享 runner 上噪声大，PR/dev/ci 跑它
  # 既慢又易误红；OSS 真包门禁（benchmark:oss + benchmark:oss:gate）挂在
  # benchmark.yml（main-only）。
  benchmark:
    name: Benchmark gate
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download built dist
        # v8.0.1（SHA 钉住：supply-chain；升级时更新 pin 与注释）
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: nudo-dist

      - name: Run benchmark
        run: pnpm run benchmark

      - name: Gate against baseline
        run: pnpm run benchmark:gate
