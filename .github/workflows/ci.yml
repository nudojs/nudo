name: CI

on:
  push:
    branches: [main, dev, ci]
  pull_request:
    branches: [main, dev, ci]
  # 夜间复测：coverage 趋势 + benchmark（避开 PR 计时噪声）
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# event_name 入 group：schedule 跑在默认分支上，
# 否则会与 main push 抢同一 group 互相 cancel。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# 矩阵（build 只跑一次，dist 经 nudo-dist artifact 共享；构建产物另
# 经 actions/cache 跨 run 复用——源码未变的 PR 直接命中缓存跳过 tsup）：
#   push main         → lint / build / test×2 shard（全量，无 --changed）+ benchmark
#   push dev|ci       → lint / build / test×2 shard（--changed 快速通道）
#   pull_request      → lint / build / test×2 shard（--changed 快速通道）
#   schedule/dispatch → build / test:coverage / benchmark / node-matrix（夜间复测）
# 快速通道细节：test job 按 git diff <since>...HEAD 选测试
# （vitest --changed，模块图 + forceRerunTriggers 安全网，见
# vitest.config.ts）；lint job 在无 .ts/.tsx/tsconfig/lockfile 变更时跳过三个 tsc。
# coverage（v8 插桩 + 阈值聚合，慢 30–60%）只跑夜间/手动：PR/dev 路径
# 本就不跑 coverage，阈值门禁挪到夜间只把发现延迟 ≤24h；main push 的
# 发布门禁 = 全量测试（2 shard，无 --changed）+ lint + benchmark。
# verify:examples / verify:docs 跑真实 CLI（tsx 直连包源码）——输入面含
# 包源码，ts 或 docs 变更都要跑；两者都没动的 push（version-bump 合并、
# workflow/benchmark 改动）才跳过。docs:gen drift gate / env baseline /
# verify:links 便宜，始终全量跑。
# test 依赖 dist：@nudo:env 动态 import 经 package.json exports 解析
# @nudojs/* → dist；lint:website 与 verify:* 脚本的 @nudojs/* 解析同样需要 dist。
# test 分 2 shard 并发（vitest --shard 按文件切分，pool: forks 下文件
# 间天然隔离）；test-coverage 不分——v8 阈值按全量聚合，分片需 merge
# coverage 报告，而夜间路径本就不频繁，不值得引入复杂度。
jobs:
  lint:
    name: Lint (tsc x2) & docs examples
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v7（SHA 钉住：supply-chain；升级时更新 pin 与注释）
        # fetch-depth: 0 — TS 变更检测要 diff base.sha
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      # 纯文档 PR（无 .ts/.tsx/tsconfig/lockfile 变更）跳过三个 tsc
      # ——tsc 输入只有这些。verify:examples / verify:docs 跑真实 CLI
      # （tsx 直连包源码 + CLI verb/flag 审计），输入面覆盖包源码与
      # 文档，故 ts 或 docs 任一变更都要跑；两者都没动的 push
      # （version-bump 合并、workflow/benchmark-only）才跳过。
      - name: Detect TS-affecting changes
        id: ts
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "ts_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base" HEAD -- \
              ':(glob)**/*.ts' ':(glob)**/*.tsx' \
              ':(glob)**/tsconfig*.json' ':(glob)pnpm-lock.yaml' | grep -q .; then
            echo "ts_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "ts_changed=false" >> "$GITHUB_OUTPUT"
          fi

      # verify:* 的文档输入面：docs/examples（矩阵+示例）、packages/website
      # （en+zh-Hans 页面与 parity 审计）、verify 脚本本身。ts 变更由上面
      # 的 ts_changed 覆盖（脚本经 tsx 消费全部包源码）。
      - name: Detect docs-affecting changes
        id: docs
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "docs_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base" HEAD -- \
              ':(glob)docs/examples/**' \
              ':(glob)packages/website/**' \
              ':(glob)scripts/verify-*.sh' | grep -q .; then
            echo "docs_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        # v4
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Setup Node.js
        # v7
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # build job 的产物（各包 dist/），替代本 job 原来的 npm run build
      - name: Download built dist
        # v8.0.1（SHA 钉住：supply-chain；升级时更新 pin 与注释）
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: nudo-dist

      - name: Lint
        if: steps.ts.outputs.ts_changed == 'true'
        run: npm run lint

      - name: Lint website
        if: steps.ts.outputs.ts_changed == 'true'
        run: npm run lint:website

      - name: Lint tests
        if: steps.ts.outputs.ts_changed == 'true'
        run: npm run lint:tests

      - name: Verify docs examples
        if: steps.ts.outputs.ts_changed == 'true' || steps.docs.outputs.docs_changed == 'true'
        run: pnpm run verify:examples

      - name: Verify website doc examples
        if: steps.ts.outputs.ts_changed == 'true' || steps.docs.outputs.docs_changed == 'true'
        run: pnpm run verify:docs

      - name: Verify docs site links
        run: pnpm run verify:links

      # 生成文件（releases*.md / api skeleton / versioning 版本表）不得与源漂移
      - name: Docs generation drift gate
        run: |
          pnpm run docs:gen
          git diff --exit-code -- \
            packages/website/docs/releases.md \
            packages/website/docs/releases-history.md \
            packages/website/docs/guides/versioning.md \
            packages/website/docs/api \
            packages/website/i18n/zh-Hans/docusaurus-plugin-content-docs/current/releases.md \
            packages/website/i18n/zh-Hans/docusaurus-plugin-content-docs/current/releases-history.md \
            packages/website/i18n/zh-Hans/docusaurus-plugin-content-docs/current/guides/versioning.md \
            packages/website/i18n/zh-Hans/docusaurus-plugin-content-docs/current/api

      # B1 — fail when committed docs/reports baseline drifted from env sources
      - name: Env coverage baseline check
        run: pnpm run coverage:env -- --check

      # Regenerate for artifact upload (does not gate)
      - name: Env coverage baseline regenerate
        if: always()
        run: pnpm run coverage:env

      - name: Upload env coverage report
        if: always()
        # v7
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: env-coverage-baseline
          path: |
            docs/reports/env-coverage-baseline.json
            docs/reports/env-coverage-baseline.md
          if-no-files-found: warn

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v7（SHA 钉住：supply-chain；升级时更新 pin 与注释）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup pnpm
        # v4
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Setup Node.js
        # v7
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 构建输入哈希：非测试源码 + 包/构建配置 + 锁文件。
      # 命中时跳过 tsup（dist ~37MB，缓存传输远快于重跑构建）；
      # 冒烟步骤仍跑，顺带验证缓存产物可用。测试文件不入哈希
      # （vitest 走 src 别名，测试变更不影响 dist）。
      - name: Compute dist cache key
        id: distkey
        run: |
          hash=$(git ls-files \
              'packages/*/src/*' \
              'packages/*/package.json' \
              'packages/*/tsconfig*.json' \
              'packages/*/tsup.config.*' \
              'package.json' \
              'tsconfig*.json' \
              'pnpm-lock.yaml' |
            grep -v '/__tests__/' | grep -v '\.test\.ts$' |
            xargs sha256sum | sha256sum | cut -d' ' -f1)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Restore dist cache
        id: dist-cache
        # v6.1.0（SHA 钉住：supply-chain；升级时更新 pin 与注释）
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            packages/*/dist
          key: dist-${{ runner.os }}-${{ steps.distkey.outputs.hash }}

      - name: Build
        if: steps.dist-cache.outputs.cache-hit != 'true'
        run: npm run build

      # bin 冒烟：包的 bin 直接指向 packages/nudojs/dist/index.js，用户唯一入口，
      # 「build 后 bin 不能跑」类回归在此兜住（发布面卫生另由 npm-safe 管）。
      - name: Smoke nudo bin
        run: node packages/nudojs/dist/index.js --version

      # 全流水线共享的构建产物（lint/test/benchmark 各下载一次，
      # 替代各自重复的 npm run build）
      - name: Upload dist artifact
        # v7
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nudo-dist
          # upload-artifact v4+ 以全部匹配文件的最近公共祖先（LCA）为
          # artifact 根目录：单独 `packages/*/dist` 的 LCA 是 packages/，
          # 条目存成 `core/dist/…`、`nudojs/dist/…`，下载后落在
          # <workspace>/core/dist 而非 packages/core/dist——run #325/#326
          # 的 lint:website TS2307（@nudojs/* 经 package.json exports
          # 解析到 dist）与 check-fix spawn MODULE_NOT_FOUND 的根因。
          # 加入根级 package.json 把 LCA 钉在仓库根，条目即以
          # `packages/*/dist/…` 存储，下载后还原到正确位置。
          # 代价：if-no-files-found 无法再兜底空构建（package.json 恒
          # 匹配），但 dist 缺失会在下游以 TS2307 / MODULE_NOT_FOUND
          # 响亮失败，同样可定位。
          path: |
            packages/*/dist
            package.json
          if-no-files-found: error
          retention-days: 1

  test:
    name: Test (shard ${{ matrix.shard }}/2)
    # PR 与 dev|ci push 走 --changed 快速通道；main push 全量跑
    # （发布门禁——Release 复用同 SHA 的 CI 绿结论）。
    # 2 shard 并发压墙时；fail-fast 关闭以保留双 shard 结果。
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v7（SHA 钉住：supply-chain；升级时更新 pin 与注释）
        # fetch-depth: 0 — --changed 要 diff base.sha（须在本地存在）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      # PR → base.sha；push → before（新分支 push 的 before 为零值
      # → 空 since → 全量跑）。main push 是发布门禁：不设 since，
      # 强制全量（不信任增量选择器覆盖合并结果）。
      # vitest --changed 即 git diff --name-only <since>...HEAD（三点式）；
      # 零命中时正常空跑退出（vitest 源码显式处理）。
      - name: Resolve changed-since base
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "since=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            :  # main：全量
          else
            before="${{ github.event.before }}"
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ]; then
              echo "since=$before" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Setup pnpm
        # v4
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Setup Node.js
        # v7
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # vitest 转换缓存（内容寻址，陈旧条目自动失效；
      # 实测 pnpm install 不清 node_modules/.vite）
      - name: Restore vitest transform cache
        id: vitest-cache
        # v6.1.0（SHA 钉住：supply-chain；升级时更新 pin 与注释）
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: node_modules/.vite/vitest
          key: vitest-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('vitest.config.ts') }}

      - name: Download built dist
        # v8.0.1（SHA 钉住：supply-chain；升级时更新 pin 与注释）
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: nudo-dist

      - name: Test
        run: |
          if [ -n "${{ steps.changed.outputs.since }}" ]; then
            npm run test -- --changed "${{ steps.changed.outputs.since }}" --shard=${{ matrix.shard }}/2
          else
            npm run test -- --shard=${{ matrix.shard }}/2
          fi

  test-coverage:
    name: Test & Coverage
    # 仅夜间复测与手动触发：v8 插桩 + 阈值聚合比裸跑慢 30–60%。
    # main push 不再跑 coverage（PR/dev 路径本就不跑，阈值门禁挪到
    # 夜间只把 coverage 回归的发现延迟 ≤24h；codecov 趋势同样随夜间
    # 上传）。不分片（阈值按全量聚合）、不用 --changed；仅共享转换缓存。
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v7（SHA 钉住：supply-chain；升级时更新 pin 与注释）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup pnpm
        # v4
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Setup Node.js
        # v7
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # vitest 转换缓存（内容寻址，陈旧条目自动失效）
      - name: Restore vitest transform cache
        id: vitest-cache
        # v6.1.0（SHA 钉住：supply-chain；升级时更新 pin 与注释）
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: node_modules/.vite/vitest
          key: vitest-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('vitest.config.ts') }}

      - name: Download built dist
        # v8.0.1（SHA 钉住：supply-chain；升级时更新 pin 与注释）
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: nudo-dist

      - name: Test
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        # v7
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          flags: unittests
          fail_ci_if_error: false

  # B1: accuracy/perf gate vs benchmark/baseline.json
  # 3.0x 阈值（gate.js 硬编码）有意保留：baseline 采自本地 Apple Silicon，
  # GitHub ubuntu-runner 常年慢 ~2.5–3x；收 2.0–2.5x 会把噪声当回归（CI 变红）。
  # 收紧前提：在 GH runner 上重跑 `pnpm run benchmark:baseline`（或改相对倍率
  # /固定 perf runner）后再改 gate.js——不要只改数字。
  # 仅 main push + 夜间：计时门禁在共享 runner 上噪声大，PR/dev/ci 跑它
  # 既慢又易误红；OSS 真包门禁（benchmark:oss + benchmark:oss:gate）挂在
  # benchmark.yml（main-only）。
  benchmark:
    name: Benchmark gate
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download built dist
        # v8.0.1（SHA 钉住：supply-chain；升级时更新 pin 与注释）
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: nudo-dist

      - name: Run benchmark
        run: pnpm run benchmark

      - name: Gate against baseline
        run: pnpm run benchmark:gate

  # 引擎版本冒烟：全部发布包 engines 声明 node>=22（2026-10 收紧；Node 20
  # 已于 2026-04-30 EOL），日常 CI 只跑 Node 24，声明下限从未被验证
  # （Node 版本行为漂移真实发生过：host-global deprecation 警告族随
  # Node ≥22.4 改过引擎行为；Float16Array 全局 Node ≥24 才有，core
  # runtime 表已加 typeof 守卫兜住，声明下限不再启动即崩）。夜间在最低
  # 声明版本上冒烟真实产品面：bin（packages/nudojs/dist）+
  # verify:examples（tsx 直连包源码，覆盖全部 CLI 动词）。矩阵 [22] =
  # 声明下限；Node 20 不再是声明面，也不可直接重扩——pnpm@11.28
  # （packageManager 钉住）运行期硬依赖 node:sqlite（Node ≥22.5），
  # 编排器自身在 Node 20 上启动即 ERR_UNKNOWN_BUILTIN_MODULE，需
  # 「高版本装依赖 + 切版本 + pnpm 走高版本的 shim」两段式才能测。
  node-matrix:
    name: Node engine smoke (${{ matrix.node-version }})
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        node-version: [22]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup pnpm
        # v4
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Setup Node.js
        # v7
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # build job 的产物（各包 dist），与 test-coverage/benchmark 同源；
      # bin 冒烟消费 dist，verify:examples 走 tsx 源码直连
      - name: Download built dist
        # v8.0.1（SHA 钉住：supply-chain；升级时更新 pin 与注释）
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: nudo-dist

      # bin 冒烟（build job 同款）：bin 直接指向 dist/index.js，用户唯一入口
      - name: Smoke nudo bin
        run: node packages/nudojs/dist/index.js --version

      # 真实产品面：全矩阵行经 pnpm run → tsx 直连源码执行 CLI
      - name: Verify docs examples
        run: pnpm run verify:examples
