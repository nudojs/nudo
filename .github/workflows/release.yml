name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # npm Trusted Publishing is bound to this GitHub environment name; the
    # OIDC token must carry the same environment claim or publish 404s.
    environment: NPM_TOKEN
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    outputs:
      published: ${{ steps.changesets.outputs.hasChangesets == 'false' }}
      publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}
    env:
      # secrets cannot appear in step `if`; expose at job level for gating.
      VSCODE_MARKETPLACE_TOKEN: ${{ secrets.VSCODE_MARKETPLACE_TOKEN }}
      OVSX_MARKETPLACE_TOKEN: ${{ secrets.OVSX_MARKETPLACE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: npm run build

      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51  # v1 (branch v1)
        with:
          version: npm run ci:version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          # setup-node writes _authToken=${NODE_AUTH_TOKEN} into .npmrc, which
          # blocks npm's OIDC trusted-publisher exchange when no real token exists.
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
          fi
          npx @changesets/cli publish
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Build website
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: pnpm --filter website run build

      - name: Upload Website Build Artifact
        if: steps.changesets.outputs.hasChangesets == 'false'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: packages/website/build

      - name: Package VSCode extension
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          mkdir -p dist
          pnpm --filter nudo-vscode run build
          cd packages/vscode
          npx @vscode/vsce package --no-dependencies -o ../../dist/nudo-vscode.vsix

      - name: Publish to VSCode Marketplace
        if: steps.changesets.outputs.hasChangesets == 'false' && env.VSCODE_MARKETPLACE_TOKEN != ''
        # Marketplace PATs expire; do not block Open VSX / GitHub Release.
        continue-on-error: true
        run: npx @vscode/vsce publish --packagePath dist/nudo-vscode.vsix -p ${{ secrets.VSCODE_MARKETPLACE_TOKEN }}

      - name: Publish to Open VSX
        if: steps.changesets.outputs.hasChangesets == 'false' && env.OVSX_MARKETPLACE_TOKEN != ''
        continue-on-error: true
        run: npx ovsx publish dist/nudo-vscode.vsix -p ${{ secrets.OVSX_MARKETPLACE_TOKEN }}

      - name: Create GitHub Release
        if: >-
          steps.changesets.outputs.hasChangesets == 'false' &&
          steps.changesets.outputs.publishedPackages != '' &&
          steps.changesets.outputs.publishedPackages != '[]'
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844  # v1
        with:
          tag_name: v${{ fromJSON(steps.changesets.outputs.publishedPackages)[0].version }}
          files: dist/nudo-vscode.vsix
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy to GitHub Pages
    needs: release
    if: needs.release.outputs.published == 'true'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
