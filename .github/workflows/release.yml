name: Release

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      confirm_major:
        description: 'Allow major version bumps (only this manual path can raise a major)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Two trains, ONE workflow file. npm Trusted Publishing is bound to a specific
# workflow filename + environment — a second workflow file cannot publish.
#   main → stable (latest): changesets/action version PR + publish + VSCE/OVSX
#   dev  → beta:            only while .changeset/pre.json exists; otherwise idle
jobs:
  release:
    name: Release
    # Stable train only.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # npm Trusted Publishing is bound to this GitHub environment name; the
    # OIDC token must carry the same environment claim or publish 404s.
    environment: NPM_TOKEN
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      # 同 SHA CI 结论门禁轮询需要读取 Actions runs
      actions: read
    outputs:
      publishedPackages: ${{ steps.changesets.outputs.published-packages }}
    env:
      # secrets cannot appear in step `if`; expose at job level for gating.
      VSCODE_MARKETPLACE_TOKEN: ${{ secrets.VSCODE_MARKETPLACE_TOKEN }}
      OVSX_MARKETPLACE_TOKEN: ${{ secrets.OVSX_MARKETPLACE_TOKEN }}
      # Major bumps are never automatic: only workflow_dispatch + confirm_major=true.
      # Push-triggered runs leave this empty and gate-major.mjs fails closed.
      CONFIRM_MAJOR: ${{ (github.event_name == 'workflow_dispatch' && inputs.confirm_major) && '1' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── 发布门禁重构：按「有没有待发布物」路由，消灭同 SHA 重复工作 ──
      # 原 Release 在每次 main push 上无条件 build + lint + test:coverage
      # （~4.5 min），而同一 push 的 CI 已跑完全相同的门禁（且是超集：
      # lint / build / test:coverage / benchmark / verify:*）。
      #   路由 A（有 pending changesets）→ 只 version + 开 Version PR：
      #     ci:version 链（gate-major / changeset version / bump-vscode /
      #     gen-releases / gen-api-docs）纯 fs，无需 dist；Version PR 本身
      #     由 CI 完整门禁，发布门禁落在 PR merge 后的路由 B。
      #   路由 B（无 pending changesets = Version PR merge 或 no-op push）→
      #     同 SHA CI 结论门禁 + 复用 CI 的 nudo-dist + publish。
      # 这不是跨 workflow `needs:`（同 push 触发的 workflow 无法互相 needs，
      # 原注释所指的不可靠即此）——这里是显式轮询同 head_sha 的 CI run，
      # 超时 / 非 success 一律 fail-closed，不发布。
      - name: Detect pending changesets
        id: csdetect
        run: |
          if git ls-files '.changeset/*.md' | grep -vxF '.changeset/README.md' | grep -q .; then
            echo "has=true"  >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
          fi

      # ── 路由 A：版本 PR（不 build、不跑测试）──
      - name: Create Release Pull Request (version only)
        id: version-pr
        if: steps.csdetect.outputs.has == 'true'
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51  # v2.1.2
        with:
          version-script: npm run ci:version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 路由 B：发布 ──
      # 与 ci-publish / major 发布门禁同一信任模型：`name@version` git tag
      # 由 changeset publish 成功时创建，存在即已发布。全部已 tag → 本次
      # push 无物可发（普通 push），直接跳过——不为 no-op publish 白等 CI。
      - name: Detect unpublished versions
        id: unpublished
        if: steps.csdetect.outputs.has == 'false'
        run: |
          node -e '
            const { execSync } = require("node:child_process");
            const { readFileSync, readdirSync, appendFileSync } = require("node:fs");
            const pending = [];
            for (const dir of readdirSync("packages")) {
              let pkg;
              try { pkg = JSON.parse(readFileSync(`packages/${dir}/package.json`, "utf8")); }
              catch { continue; }
              if (pkg.private || !pkg.name || pkg.version === undefined) continue;
              const tag = `${pkg.name}@${pkg.version}`;
              if (!execSync(`git tag -l ${JSON.stringify(tag)}`).toString().trim()) pending.push(tag);
            }
            appendFileSync(process.env.GITHUB_OUTPUT, `any=${pending.length > 0}\n`);
            console.log(pending.length ? `unpublished: ${pending.join(", ")}` : "all workspace versions already tagged (nothing to publish)");
          '

      # Release must not publish untested code：等待同 head_sha 的 CI run
      # 完成 且 conclusion=success。CI 门禁是原先内联 Lint+Test 的严格
      # 超集（额外含 benchmark / verify:examples / verify:docs）。
      - name: Wait for CI gate (same SHA)
        id: cigate
        if: steps.csdetect.outputs.has == 'false' && steps.unpublished.outputs.any == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 1200 ))
          while :; do
            resp=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push" \
              --jq 'if (.workflow_runs | length) > 0 then .workflow_runs[0] | "\(.id) \(.status) \(.conclusion // "")" else "" end' || true)
            if [ -n "$resp" ]; then
              set -- $resp
              run_id=$1; status=$2; conclusion=${3:-}
              url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
              if [ "$status" = "completed" ]; then
                if [ "$conclusion" = "success" ]; then
                  echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
                  echo "CI green at ${GITHUB_SHA::7} — $url"
                  exit 0
                fi
                echo "::error::CI run for ${GITHUB_SHA} concluded '${conclusion}' — publish BLOCKED. $url（若被更新 push cancel：CI 重跑绿后手动 dispatch Release）"
                exit 1
              fi
              echo "CI ${status} — ${url}"
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Timed out waiting for CI at ${GITHUB_SHA} — fail closed, nothing published."
              exit 1
            fi
            sleep 15
          done

      # publish 需要 dist（ci:publish → changeset publish 发布 packages/*/dist）。
      # 复用 CI 刚上传的 nudo-dist（同 SHA 构建）；artifact 过期（retention
      # 1 天，如手工 dispatch 旧 SHA）则回退本地构建。
      - name: Download built dist
        if: steps.csdetect.outputs.has == 'false' && steps.unpublished.outputs.any == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ steps.cigate.outputs.run_id }}" \
            --name nudo-dist --repo "${GITHUB_REPOSITORY}" || npm run build

      # changesets/action 的 publish 输入 populate `published-packages`
      # ——后续 tag / GitHub Release 步骤依赖它；裸 `changeset publish`
      # 会让这些输出为空、步骤被静默跳过（create-github-releases=false：
      # per-package releases 会与下面带 .vsix 的 monorepo `v*` release 相撞；
      # push-git-tags 保持默认 true——无 per-package GitHub Release 也要包 tag）。
      - name: Publish
        id: changesets
        if: steps.csdetect.outputs.has == 'false' && steps.unpublished.outputs.any == 'true'
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51  # v2.1.2
        with:
          version-script: npm run ci:version
          publish-script: npm run ci:publish
          create-github-releases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      # 文档站部署已解耦：docs-deploy.yml 在 main push 时独立构建部署

      - name: Package VSCode extension
        if: steps.changesets.outputs.has-changesets == 'false' && steps.changesets.outputs.published-packages != '' && steps.changesets.outputs.published-packages != '[]'
        run: |
          mkdir -p dist
          pnpm --filter nudo-vscode run build
          # B3: language-client smoke must pass before we ship a .vsix
          pnpm --filter nudo-vscode run smoke
          cd packages/vscode
          npx @vscode/vsce package --no-dependencies -o ../../dist/nudo-vscode.vsix

      - name: Publish to VSCode Marketplace
        id: vsce-publish
        if: >-
          steps.changesets.outputs.has-changesets == 'false' &&
          steps.changesets.outputs.published-packages != '' &&
          steps.changesets.outputs.published-packages != '[]' &&
          env.VSCODE_MARKETPLACE_TOKEN != ''
        # Marketplace PATs expire; do not block Open VSX / GitHub Release.
        continue-on-error: true
        # Secret is already exposed via job-level env: — quote it as a shell
        # word. Never expand ${{ secrets.* }} into run: (shell injection face).
        run: npx @vscode/vsce publish --packagePath dist/nudo-vscode.vsix -p "$VSCODE_MARKETPLACE_TOKEN"

      # keep continue-on-error above (marketplace flake must not block npm / GH Release),
      # but never fail silently — shout in the step summary + job annotation.
      - name: Surface VSCode Marketplace failure
        if: steps.vsce-publish.outcome == 'failure'
        run: |
          echo "::warning::VSCode Marketplace publish FAILED — extension is NOT on the Marketplace. Check VSCODE_MARKETPLACE_TOKEN (likely expired) and re-publish manually."
          {
            echo "## ⚠️ VSCode Marketplace publish FAILED"
            echo ""
            echo "npm packages were published, but the VS Code extension is **not** on the Marketplace."
            echo "Likely cause: expired \`VSCODE_MARKETPLACE_TOKEN\`."
            echo "Re-publish manually once the token is renewed:"
            echo '```bash'
            echo 'npx @vscode/vsce publish --packagePath dist/nudo-vscode.vsix -p "$VSCODE_MARKETPLACE_TOKEN"'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to Open VSX
        id: ovsx-publish
        if: >-
          steps.changesets.outputs.has-changesets == 'false' &&
          steps.changesets.outputs.published-packages != '' &&
          steps.changesets.outputs.published-packages != '[]' &&
          env.OVSX_MARKETPLACE_TOKEN != ''
        continue-on-error: true
        # Same contract as vsce: job-level env: + quoted "$VAR", no ${{ }} in run:.
        run: npx ovsx publish dist/nudo-vscode.vsix -p "$OVSX_MARKETPLACE_TOKEN"

      - name: Surface Open VSX failure
        if: steps.ovsx-publish.outcome == 'failure'
        run: |
          echo "::warning::Open VSX publish FAILED — extension is NOT on Open VSX. Check OVSX_MARKETPLACE_TOKEN (likely expired) and re-publish manually."
          {
            echo "## ⚠️ Open VSX publish FAILED"
            echo ""
            echo "npm packages were published, but the VS Code extension is **not** on Open VSX."
            echo "Likely cause: expired \`OVSX_MARKETPLACE_TOKEN\`."
            echo "Re-publish manually once the token is renewed:"
            echo '```bash'
            echo 'npx ovsx publish dist/nudo-vscode.vsix -p "$OVSX_MARKETPLACE_TOKEN"'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # published-packages is [{name, version}, …] and can version-skew across
      # packages (e.g. nudojs 0.x vs @nudojs/* 3.x). Never tag from [0] — take
      # the highest semver so the monorepo release tag is deterministic.
      - name: Resolve release tag (highest published version)
        id: release-tag
        if: >-
          steps.changesets.outputs.has-changesets == 'false' &&
          steps.changesets.outputs.published-packages != '' &&
          steps.changesets.outputs.published-packages != '[]'
        run: |
          tag=$(node -e '
            const pkgs = JSON.parse(process.env.PUBLISHED);
            // Semver precedence (not just major.minor.patch): no prerelease >
            // prerelease; prerelease identifiers compare numeric-then-ASCII
            // with numeric < alphanumeric; build metadata ignored. Without
            // this, 1.0.0-beta.1 tied with 1.0.0 and sort().pop() picked by
            // array order.
            const parse = (v) => {
              const s = String(v).replace(/^v/, "").split("+")[0];
              const dash = s.indexOf("-");
              const core = (dash === -1 ? s : s.slice(0, dash)).split(".");
              return {
                maj: parseInt(core[0], 10) || 0,
                min: parseInt(core[1], 10) || 0,
                pat: parseInt(core[2], 10) || 0,
                pre: dash === -1 ? null : s.slice(dash + 1).split("."),
              };
            };
            const cmpId = (x, y) => {
              const xn = /^[0-9]+$/.test(x), yn = /^[0-9]+$/.test(y);
              if (xn && yn) return parseInt(x, 10) - parseInt(y, 10);
              if (xn !== yn) return xn ? -1 : 1;
              return x < y ? -1 : x > y ? 1 : 0;
            };
            const cmp = (a, b) => {
              const pa = parse(a), pb = parse(b);
              if (pa.maj !== pb.maj) return pa.maj - pb.maj;
              if (pa.min !== pb.min) return pa.min - pb.min;
              if (pa.pat !== pb.pat) return pa.pat - pb.pat;
              if (pa.pre === null && pb.pre === null) return 0;
              if (pa.pre === null) return 1;
              if (pb.pre === null) return -1;
              const n = pa.pre.length < pb.pre.length ? pa.pre.length : pb.pre.length;
              for (let i = 0; i < n; i++) {
                const d = cmpId(pa.pre[i], pb.pre[i]);
                if (d !== 0) return d;
              }
              return pa.pre.length - pb.pre.length;
            };
            const versions = pkgs.map((p) => p.version);
            const tag = "v" + versions.slice().sort(cmp).pop();
            // Whitelist BEFORE GITHUB_OUTPUT: vMAJOR.MINOR.PATCH with optional
            // semver prerelease (-pre) and build metadata (+meta). Explicit gate
            // rejects whitespace / newlines / "=" (GITHUB_OUTPUT line injection
            // face) and ".." (empty pre/build identifiers); the structural
            // regex is closed-charset. Prerelease so a stable-train publish of
            // 1.2.3-beta.1 still resolves a GitHub Release tag instead of
            // failing closed after npm publish.
            if (/[\s=]|\.\./.test(tag) ||
                !/^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/.test(tag)) {
              console.error("Resolved release tag failed whitelist: " + JSON.stringify(tag));
              process.exit(1);
            }
            process.stdout.write(tag);
          ')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
        env:
          PUBLISHED: ${{ steps.changesets.outputs.published-packages }}

      - name: Create GitHub Release
        if: >-
          steps.changesets.outputs.has-changesets == 'false' &&
          steps.changesets.outputs.published-packages != '' &&
          steps.changesets.outputs.published-packages != '[]'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          tag_name: ${{ steps.release-tag.outputs.tag }}
          name: ${{ steps.release-tag.outputs.tag }}
          files: dist/nudo-vscode.vsix
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        if: >-
          steps.changesets.outputs.has-changesets == 'false' &&
          steps.changesets.outputs.published-packages != '' &&
          steps.changesets.outputs.published-packages != '[]'
        # Pass values via env: and quote "$VAR" — never splice ${{ steps.* }} into
        # run: (published-packages / tag are data, and a single quote or newline
        # would break out of the script text).
        env:
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          {
            echo "## Released ${RELEASE_TAG}"
            echo ""
            echo "Published packages:"
            echo '```json'
            printf '%s\n' "${PUBLISHED_PACKAGES}"
            echo '```'
            echo ""
            echo "GitHub Release: ${SERVER_URL}/${REPOSITORY}/releases/tag/${RELEASE_TAG}"
          } >> "$GITHUB_STEP_SUMMARY"

  # Beta train — same workflow file so npm Trusted Publishing authorizes us.
  # `.changeset/pre.json` supplies the dist-tag (`beta`). No VSCE / OVSX / GH Release.
  release-beta:
    name: Release (beta)
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    # Must match the Trusted Publisher environment claim (same as stable).
    environment: NPM_TOKEN
    permissions:
      id-token: write
      contents: write
      # 同 SHA CI 结论门禁轮询需要读取 Actions runs
      actions: read
    env:
      # Same policy as stable: push never auto-raises a major.
      CONFIRM_MAJOR: ${{ (github.event_name == 'workflow_dispatch' && inputs.confirm_major) && '1' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Beta train is idle outside changesets pre mode. Stable publishes go
      # through `main` (release job). Do not hard-fail dev pushes when pre.json
      # is absent — that is the intentional state after cutting the 1.x line.
      # （前置到 install 之后：idle 时不再白跑 build + lint + test:coverage
      # ——原顺序在每次 dev push 上无条件烧 ~4.5 min 纯重复工作。）
      - name: Detect changesets pre mode
        id: pre
        run: |
          set -euo pipefail
          if [ -f .changeset/pre.json ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
            echo "pre.json tag: $(node -p "require('./.changeset/pre.json').tag")"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "Not in changesets pre mode — beta train idle (stable publishes via main)."
          fi

      # 与 stable 路由 B 同一模式：dev push 的 CI（--changed 快速通道 +
      # lint/build）是原先内联 build+lint+test:coverage 的替代门禁。
      # 轮询同 head_sha 的 CI run，fail-closed（超时 / 非 success 不发布）。
      - name: Wait for CI gate (same SHA)
        id: cigate
        if: steps.pre.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 1200 ))
          while :; do
            resp=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push" \
              --jq 'if (.workflow_runs | length) > 0 then .workflow_runs[0] | "\(.id) \(.status) \(.conclusion // "")" else "" end' || true)
            if [ -n "$resp" ]; then
              set -- $resp
              run_id=$1; status=$2; conclusion=${3:-}
              url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
              if [ "$status" = "completed" ]; then
                if [ "$conclusion" = "success" ]; then
                  echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
                  echo "CI green at ${GITHUB_SHA::7} — $url"
                  exit 0
                fi
                echo "::error::CI run for ${GITHUB_SHA} concluded '${conclusion}' — beta publish BLOCKED. $url"
                exit 1
              fi
              echo "CI ${status} — ${url}"
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Timed out waiting for CI at ${GITHUB_SHA} — fail closed, nothing published."
              exit 1
            fi
            sleep 15
          done

      # publish 需要 dist；复用同 SHA CI 的 nudo-dist，过期则回退本地构建
      # （dist 产自 push 时的源码——与原先「version 之前 build」同源，
      # version 只改 package.json 版本号，不改变 dist 语义）。
      - name: Download built dist
        if: steps.pre.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ steps.cigate.outputs.run_id }}" \
            --name nudo-dist --repo "${GITHUB_REPOSITORY}" || npm run build

      # Consume pending changesets into `*-beta.n`, push with [skip ci] so we
      # do not re-enter this job; publish still runs in THIS job.
      # gate-major fails closed on push: a `major` changeset blocks the beta train
      # unless this run was dispatched with confirm_major=true.
      - name: Version beta (if changesets pending)
        if: steps.pre.outputs.active == 'true'
        run: |
          set -euo pipefail
          if ls .changeset/*.md >/dev/null 2>&1 && \
             ls .changeset/*.md | grep -v 'README.md' | grep -q .; then
            node scripts/gate-major.mjs --save-baseline
            npx changeset version
            node scripts/gate-major.mjs --check-baseline
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: version beta packages [skip ci]"
            git push origin HEAD:dev
          else
            echo "No pending changesets — publishing current package.json versions."
          fi

      - name: Publish to npm (tag from pre.json)
        if: steps.pre.outputs.active == 'true'
        run: |
          set -euo pipefail
          # Same gate as stable: 2.x / major jumps / first 1.0.0 need confirm_major=true.
          # The 1.x train (1.0.1+) auto-publishes.
          node scripts/gate-major.mjs --for-publish
          # setup-node writes _authToken=${NODE_AUTH_TOKEN} into .npmrc, which
          # blocks npm's OIDC trusted-publisher exchange when no real token exists.
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "${NPM_CONFIG_USERCONFIG}" ]; then
            sed -i '/_authToken/d' "${NPM_CONFIG_USERCONFIG}"
          fi
          # Clear NODE_AUTH_TOKEN so npm prefers OIDC (Trusted Publishing).
          export NODE_AUTH_TOKEN=""
          npx changeset publish
        env:
          NPM_CONFIG_PROVENANCE: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: steps.pre.outputs.active == 'true'
        run: |
          {
            echo "## Beta publish"
            echo ""
            echo "Trigger: \`dev\` @ \`${GITHUB_SHA::7}\`"
            echo ""
            echo "npm dist-tag: from \`.changeset/pre.json\` (currently \`beta\`)"
            echo ""
            echo "Verify: \`npm view <pkg> dist-tags\` / \`npm view <pkg> versions\`"
          } >> "$GITHUB_STEP_SUMMARY"


