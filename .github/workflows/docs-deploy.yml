name: Docs deploy

# 文档站与 npm 发布解耦：main 上任何影响站点内容的提交都会触发部署。
# 站点发布不再依赖 changeset 发版（历史问题：文档改动要等下一次 npm 发布才上线）。
on:
  push:
    branches: [main]
    paths:
      - 'packages/website/**'
      - 'docs/**'
      - 'README.md'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

concurrency:
  group: docs-deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Build & deploy docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # showLastUpdateTime 需要全量 git 历史
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 部署门禁改为「同 SHA CI 结论门禁」：CI 在同一 push 上已跑
      # verify:docs / verify:examples / docs:gen drift gate（lint job）+
      # 全量测试 / benchmark——严格超集。原先本 job 内联重跑的
      # Verify docs examples 与 Docs generation drift gate 是同 SHA 重复，
      # 已删。fail-closed：CI 未跑/超时/非 success 一律不部署。
      # （这不同于跨 workflow `needs:`——同 push 触发的 workflow 无法互相
      # needs；这里是显式轮询同 head_sha 的 CI run，结论确定。）
      - name: Wait for CI gate (same SHA)
        id: cigate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 1200 ))
          while :; do
            resp=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push" \
              --jq 'if (.workflow_runs | length) > 0 then .workflow_runs[0] | "\(.id) \(.status) \(.conclusion // "")" else "" end' || true)
            if [ -n "$resp" ]; then
              set -- $resp
              run_id=$1; status=$2; conclusion=${3:-}
              url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
              if [ "$status" = "completed" ]; then
                if [ "$conclusion" = "success" ]; then
                  echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
                  echo "CI green at ${GITHUB_SHA::7} — $url"
                  exit 0
                fi
                echo "::error::CI run for ${GITHUB_SHA} concluded '${conclusion}' — docs NOT deployed. $url (若被更新的 push cancel，需重跑本 workflow)"
                exit 1
              fi
              echo "CI ${status} — ${url}"
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Timed out waiting for CI at ${GITHUB_SHA} — fail closed, docs NOT deployed."
              exit 1
            fi
            sleep 15
          done

      # 复用 CI 刚构建的 nudo-dist（verify:docs 经 tsx 跑 CLI；@nudo:env 动态
      # import 按 package exports 解析 @nudojs/* → dist）。artifact 过期
      # （retention 1 天，如手工 dispatch 旧 SHA）则回退本地构建。
      - name: Download built dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ steps.cigate.outputs.run_id }}" \
            --name nudo-dist --repo "${GITHUB_REPOSITORY}" || npm run build

      - name: Build docs
        run: pnpm run docs:build

      # agent 面（每页 .md + llms-full.txt）由 website 的 `postbuild` 生成——
      # 与本地 `pnpm run docs:build` 同一条链路，CI 无需重复执行。

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: packages/website/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
