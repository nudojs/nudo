name: Website

on:
  push:
    branches: [main, dev]
    paths:
      - 'packages/website/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  pull_request:
    branches: [main, dev, ci]
    paths:
      - 'packages/website/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm --filter website run build

      # PR 预览：把构建产物发布到 Cloudflare Pages 预览部署。
      # 一次性配置（repo 设置，非 workflow 维护）：
      #   1. `wrangler pages project create nudo-docs --production-branch main`
      #   2. secrets: CLOUDFLARE_API_TOKEN（Pages 写权限）
      #   3. vars: CLOUDFLARE_ACCOUNT_ID（账户 ID）
      # 变量未配置时静默跳过；baseUrl 是 /nudo/ 路径，预览域名下无需改写。
      - name: Publish PR preview (Cloudflare Pages)
        if: github.event_name == 'pull_request' && vars.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          projectName: nudo-docs
          directory: packages/website/build
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
