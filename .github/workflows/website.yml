name: Website

on:
  # push main 不触发：docs-deploy.yml 在同样路径上构建并部署同一站点
  # （其 dist 需求与本 workflow 相同），Website 在 main 上只 build 不部署
  # ——纯重复冒烟。dev 无 docs-deploy，保留 dev push 冒烟。
  push:
    branches: [dev]
    paths:
      - 'packages/website/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/website.yml'
  pull_request:
    branches: [main, dev, ci]
    paths:
      - 'packages/website/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/website.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v7（SHA 钉住：supply-chain；升级时更新 pin 与注释）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup pnpm
        # v4
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Setup Node.js
        # v7
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # playground / polyfills 经 package exports 解析 @nudojs/* → dist
      - name: Build packages
        run: pnpm run build

      - name: Build docs
        run: pnpm --filter website run build

      # PR 预览：把构建产物发布到 Cloudflare Pages 预览部署。
      # 一次性配置（repo 设置，非 workflow 维护）：
      #   1. `wrangler pages project create nudo-docs --production-branch main`
      #   2. secrets: CLOUDFLARE_API_TOKEN（Pages 写权限）
      #   3. vars: CLOUDFLARE_ACCOUNT_ID（账户 ID）
      # 变量未配置时跳过；旧 `cloudflare/pages-action` 仓库已下架，改用 wrangler-action。
      # baseUrl 是 /nudo/ 路径，预览域名下无需改写。
      - name: Publish PR preview (Cloudflare Pages)
        if: github.event_name == 'pull_request' && vars.CLOUDFLARE_ACCOUNT_ID != ''
        # v4（SHA 钉住：supply-chain；升级时更新 pin 与注释）
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy packages/website/build --project-name=nudo-docs --branch=pr-${{ github.event.number }}
